#
# API Reference sections
#
# Some service-sections will have versions that only has `readme_oas` config.  For ex:
#   "2022-07-19":  # <-- must explicity make it a string, o/w Python thinks it's a datetime obj
#     readme_oas:
#       - 62e3573b905fdb0087354cd5
#
# This indicates that version does NOT exist for the service-section.  Instead, we use it as a
# placeholder to generate an OAS file for this versoin from the latest existing version, *but*
# replacing the `Meld-Version` static header with that of the "non-existing" version's.
# This is a convenience, to generate OAS files with the right `Meld-Version` values to be uploaded
# to the respective API Reference version.
# ----------------------------------------------------------------------
# BANK LINKING
# ----------------------------------------------------------------------
aggregation-http:
  BANK LINKING:
    tags:
      - name: Financial Account Connect
