            tags:
              - Transactions
          /bank-linking/transactions:
            methods:
              - get
            tags:
              - Transactions
          /bank-linking/investments/holdings/{investmentHoldingId}:
            methods:
              - get
            tags:
              - Investments
          /bank-linking/investments/holdings:
            methods:
              - get
            tags:
              - Investments
          /bank-linking/investments/transactions/{investmentTransactionId}:
            methods:
              - get
            tags:
              - Investments
          /bank-linking/investments/transactions:
            methods:
              - get
            tags:
              - Investments
          /institutions/{institutionId}:
            methods:
              - get
            tags:
              - Institutions
          /institutions:
            methods:
              - get
            tags:
              - Institutions
        components_to_modify:
          ConnectCompleteRequest:
            - path: properties.serviceProvider.enum
              replace_with: *supported_banklinking_sp
          ConnectProviderResponse:
            - path: properties.serviceProvider.enum
              replace_with: *supported_banklinking_sp
          FinancialAccountProcessorCreateTokenRequest:
            - path: properties.serviceProvider.enum
              replace_with: *supported_banklinking_sp
          FinancialAccountProcessorCreateTokenResponse:
            - path: properties.serviceProvider.enum
              replace_with: *supported_banklinking_sp
          ImportDetails:
            - path: properties.serviceProvider.enum
              replace_with: *supported_banklinking_sp
          ImportPlaidDetails:
            - path: properties.serviceProvider.enum
              replace_with: *supported_banklinking_sp
        components_defaults:
          ConnectStartRequest:
            - path: properties.externalCustomerId.default
              value: "testUser"
            - path: properties.products.default
              value:
                - "TRANSACTIONS"
                - "IDENTIFIERS"
                - "BALANCES"
                - "OWNERS"
